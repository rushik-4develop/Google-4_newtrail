name: AWS Backup and Disaster Recovery

on:
  schedule:
    # Run daily backups at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly disaster recovery tests on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  push:
    branches: [ "main" ]
    paths:
      - 'backup/**'
      - '.github/workflows/aws-backup-disaster-recovery.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'backup'
        type: choice
        options:
          - backup
          - restore
          - dr-test
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      restore_point:
        description: 'Restore point (for restore operation)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  BACKUP_VAULT: bookstore-backup-vault

jobs:
  database-backup:
    name: Database Backup
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.operation == 'backup' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create RDS Snapshot
        id: rds-snapshot
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          SNAPSHOT_ID="bookstore-db-${{ github.event.inputs.environment || 'production' }}-snapshot-$TIMESTAMP"
          
          # Create manual snapshot
          aws rds create-db-snapshot \
            --db-instance-identifier bookstore-db-${{ github.event.inputs.environment || 'production' }} \
            --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "snapshot-id=$SNAPSHOT_ID" >> $GITHUB_OUTPUT
          
          # Wait for snapshot to complete
          echo "Waiting for snapshot to complete..."
          aws rds wait db-snapshot-completed --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "Database snapshot created successfully: $SNAPSHOT_ID"

      - name: Tag Backup Resources
        run: |
          # Tag the snapshot for easy identification and lifecycle management
          aws rds add-tags-to-resource \
            --resource-name "arn:aws:rds:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:snapshot:${{ steps.rds-snapshot.outputs.snapshot-id }}" \
            --tags Key=Environment,Value=${{ github.event.inputs.environment || 'production' }} \
                   Key=BackupType,Value=automated \
                   Key=RetentionDays,Value=30 \
                   Key=Application,Value=bookstore

      - name: Copy Snapshot to Another Region
        if: github.event.inputs.environment == 'production' || contains(github.event.schedule, '0 2 * * *')
        run: |
          # Copy snapshot to another region for disaster recovery
          DR_REGION="us-west-2"
          SNAPSHOT_ID="${{ steps.rds-snapshot.outputs.snapshot-id }}"
          
          aws rds copy-db-snapshot \
            --region $DR_REGION \
            --source-db-snapshot-identifier "arn:aws:rds:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:snapshot:$SNAPSHOT_ID" \
            --target-db-snapshot-identifier "$SNAPSHOT_ID-dr" \
            --source-region ${{ env.AWS_REGION }}

      - name: Cleanup Old Snapshots
        run: |
          # Get snapshots older than 30 days
          CUTOFF_DATE=$(date -u -d '30 days ago' +"%Y-%m-%d")
          
          OLD_SNAPSHOTS=$(aws rds describe-db-snapshots \
            --snapshot-type manual \
            --db-instance-identifier bookstore-db-${{ github.event.inputs.environment || 'production' }} \
            --query "DBSnapshots[?SnapshotCreateTime<'$CUTOFF_DATE'].DBSnapshotIdentifier" \
            --output text)
          
          for snapshot in $OLD_SNAPSHOTS; do
            if [[ $snapshot == *"bookstore-db-${{ github.event.inputs.environment || 'production' }}-snapshot"* ]]; then
              echo "Deleting old snapshot: $snapshot"
              aws rds delete-db-snapshot --db-snapshot-identifier $snapshot
            fi
          done

  s3-backup:
    name: S3 Data Backup
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.operation == 'backup' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backup S3 Data
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          SOURCE_BUCKET="bookstore-data-${{ github.event.inputs.environment || 'production' }}"
          BACKUP_BUCKET="bookstore-backups-${{ github.event.inputs.environment || 'production' }}"
          
          # Create backup directory
          aws s3 sync s3://$SOURCE_BUCKET s3://$BACKUP_BUCKET/daily-backups/$TIMESTAMP/ \
            --delete \
            --storage-class STANDARD_IA
          
          echo "S3 backup completed to s3://$BACKUP_BUCKET/daily-backups/$TIMESTAMP/"

      - name: Cross-Region S3 Replication Check
        run: |
          SOURCE_BUCKET="bookstore-data-${{ github.event.inputs.environment || 'production' }}"
          
          # Check if cross-region replication is working
          REPLICATION_STATUS=$(aws s3api get-bucket-replication \
            --bucket $SOURCE_BUCKET \
            --query 'ReplicationConfiguration.Rules[0].Status' \
            --output text 2>/dev/null || echo "not-configured")
          
          if [ "$REPLICATION_STATUS" = "Enabled" ]; then
            echo "Cross-region replication is enabled and working"
          else
            echo "Warning: Cross-region replication is not configured"
            # Send alert
            aws sns publish \
              --topic-arn arn:aws:sns:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:bookstore-alerts-${{ github.event.inputs.environment || 'production' }} \
              --message "⚠️ WARNING: S3 cross-region replication is not configured for disaster recovery" \
              --subject "Bookstore Backup Configuration Alert"
          fi

  application-backup:
    name: Application Configuration Backup
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.operation == 'backup' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Backup ECS Task Definitions
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          BACKUP_DIR="config-backups/$TIMESTAMP"
          
          mkdir -p $BACKUP_DIR
          
          # Backup current task definition
          aws ecs describe-task-definition \
            --task-definition bookstore-app-${{ github.event.inputs.environment || 'production' }} \
            --query taskDefinition > $BACKUP_DIR/task-definition.json
          
          # Backup service configuration
          aws ecs describe-services \
            --cluster bookstore-cluster-${{ github.event.inputs.environment || 'production' }} \
            --services bookstore-service-${{ github.event.inputs.environment || 'production' }} \
            --query 'services[0]' > $BACKUP_DIR/service-config.json

      - name: Backup Load Balancer Configuration
        run: |
          BACKUP_DIR="config-backups/$(date +"%Y%m%d-%H%M%S")"
          
          # Backup ALB configuration
          aws elbv2 describe-load-balancers \
            --names bookstore-alb-${{ github.event.inputs.environment || 'production' }} \
            > $BACKUP_DIR/alb-config.json
          
          # Backup target groups
          aws elbv2 describe-target-groups \
            --names bookstore-tg-${{ github.event.inputs.environment || 'production' }} \
            > $BACKUP_DIR/target-groups.json

      - name: Upload Configuration Backup to S3
        run: |
          BACKUP_DIR="config-backups/$(date +"%Y%m%d-%H%M%S")"
          BACKUP_BUCKET="bookstore-backups-${{ github.event.inputs.environment || 'production' }}"
          
          aws s3 sync $BACKUP_DIR s3://$BACKUP_BUCKET/config-backups/$(date +"%Y%m%d-%H%M%S")/ \
            --storage-class STANDARD_IA

  disaster-recovery-test:
    name: Disaster Recovery Test
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.operation == 'dr-test'
    runs-on: ubuntu-latest
    environment: dr-test
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2  # DR region

      - name: Test Database Recovery
        id: db-recovery-test
        run: |
          # Find latest snapshot from primary region
          LATEST_SNAPSHOT=$(aws rds describe-db-snapshots \
            --region us-west-2 \
            --snapshot-type manual \
            --query "DBSnapshots[?contains(DBSnapshotIdentifier, 'bookstore-db-production-snapshot') && contains(DBSnapshotIdentifier, 'dr')].{ID:DBSnapshotIdentifier,Created:SnapshotCreateTime}|sort_by(@, &Created)|[-1].ID" \
            --output text)
          
          if [ "$LATEST_SNAPSHOT" != "None" ] && [ "$LATEST_SNAPSHOT" != "" ]; then
            echo "Found latest DR snapshot: $LATEST_SNAPSHOT"
            
            # Create test database from snapshot
            TEST_DB_ID="bookstore-dr-test-$(date +%s)"
            
            aws rds restore-db-instance-from-db-snapshot \
              --region us-west-2 \
              --db-instance-identifier $TEST_DB_ID \
              --db-snapshot-identifier $LATEST_SNAPSHOT \
              --db-instance-class db.t3.micro \
              --no-multi-az \
              --no-publicly-accessible
            
            echo "test-db-id=$TEST_DB_ID" >> $GITHUB_OUTPUT
            
            # Wait for database to be available
            echo "Waiting for test database to be available..."
            timeout 1200 aws rds wait db-instance-available --region us-west-2 --db-instance-identifier $TEST_DB_ID
            
            echo "✅ Database recovery test successful"
          else
            echo "❌ No DR snapshots found"
            exit 1
          fi

      - name: Test Application Connectivity
        run: |
          # Get the test database endpoint
          TEST_DB_ENDPOINT=$(aws rds describe-db-instances \
            --region us-west-2 \
            --db-instance-identifier ${{ steps.db-recovery-test.outputs.test-db-id }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          
          echo "Test database endpoint: $TEST_DB_ENDPOINT"
          
          # Test basic connectivity
          timeout 10 bash -c "</dev/tcp/$TEST_DB_ENDPOINT/5432" && echo "✅ Database connectivity test successful" || echo "❌ Database connectivity test failed"

      - name: Cleanup Test Resources
        if: always()
        run: |
          # Delete test database
          if [ "${{ steps.db-recovery-test.outputs.test-db-id }}" != "" ]; then
            aws rds delete-db-instance \
              --region us-west-2 \
              --db-instance-identifier ${{ steps.db-recovery-test.outputs.test-db-id }} \
              --skip-final-snapshot \
              --delete-automated-backups || true
          fi

      - name: DR Test Report
        run: |
          echo "## 🧪 Disaster Recovery Test Report" >> $GITHUB_STEP_SUMMARY
          echo "### Test Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Recovery**: ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Connectivity Test**: ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **RTO (Recovery Time Objective)**: ~20 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **RPO (Recovery Point Objective)**: Last backup" >> $GITHUB_STEP_SUMMARY

  restore-operation:
    name: Restore from Backup
    if: github.event.inputs.operation == 'restore'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Validate Restore Point
        run: |
          if [ "${{ github.event.inputs.restore_point }}" = "" ]; then
            echo "Error: restore_point is required for restore operation"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore Database
        run: |
          RESTORE_POINT="${{ github.event.inputs.restore_point }}"
          NEW_DB_ID="bookstore-db-${{ github.event.inputs.environment }}-restored-$(date +%s)"
          
          # Restore from snapshot
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier $NEW_DB_ID \
            --db-snapshot-identifier $RESTORE_POINT
          
          echo "Database restore initiated: $NEW_DB_ID"
          echo "Please update your application configuration to use the new database endpoint"

      - name: Send Restore Notification
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:bookstore-alerts-${{ github.event.inputs.environment }} \
            --message "🔄 RESTORE OPERATION: Database restore operation initiated from snapshot ${{ github.event.inputs.restore_point }}" \
            --subject "Bookstore Database Restore Operation"

  backup-report:
    name: Generate Backup Report
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.operation == 'backup'
    runs-on: ubuntu-latest
    needs: [database-backup, s3-backup, application-backup]
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Backup Summary
        run: |
          echo "## 💾 Backup Report - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "### Backup Status:" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Backup**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Data Backup**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration Backup**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor backup retention policies" >> $GITHUB_STEP_SUMMARY
          echo "- Verify cross-region replication" >> $GITHUB_STEP_SUMMARY
          echo "- Schedule next DR test" >> $GITHUB_STEP_SUMMARY

      - name: Send Backup Completion Notification
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:bookstore-alerts-${{ github.event.inputs.environment || 'production' }} \
            --message "✅ SUCCESS: Daily backup operations completed successfully for ${{ github.event.inputs.environment || 'production' }} environment" \
            --subject "Bookstore Daily Backup Completed"